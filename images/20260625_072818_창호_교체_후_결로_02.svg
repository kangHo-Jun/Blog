<svg xmlns="http://www.w3.org/2000/svg" width="800" height="242" viewBox="0 0 800 242"><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="24" width="720" height="44" rx="8" fill="#2c5f8a"/><text x="400" y="53" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">샤시 단열재 동시 시공 체크리스트</text><rect x="40" y="68" width="720" height="52" fill="#2c5f8a"/><rect x="40" y="68" width="220" height="52" fill="#2c5f8a" stroke="#cccccc"/><text x="150" y="101" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">기준</text><rect x="260" y="68" width="125" height="52" fill="#2c5f8a" stroke="#cccccc"/><text x="322.5" y="101" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">시공 단계</text><rect x="385" y="68" width="125" height="52" fill="#2c5f8a" stroke="#cccccc"/><text x="447.5" y="101" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">확인 항목</text><rect x="510" y="68" width="125" height="52" fill="#2c5f8a" stroke="#cccccc"/><text x="572.5" y="101" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">적합 기준</text><rect x="635" y="68" width="125" height="52" fill="#2c5f8a" stroke="#cccccc"/><text x="697.5" y="101" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">부적합 시 문제</text><rect x="40" y="120" width="720" height="42" fill="#ffffff" stroke="#cccccc"/><text x="54" y="147" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="'Noto Sans KR', sans-serif">◎ 필수 준수   ○ 권장   △ 조건부</text><rect x="40" y="162" width="720" height="46" fill="#f7f9fc" stroke="#cccccc"/><text x="54" y="190" fill="#4c5a67" font-size="14" font-weight="400" text-anchor="start" font-family="'Noto Sans KR', sans-serif">실제 시공 순서는 현장 조건과 샤시